# 推送了词典、规则或 data/ 下的文件后，清掉 jsDelivr 上这几个文件的缓存（不清的话 jsDelivr 最多缓存 12 小时）。
# 用户的注入程序每 6 小时检查一次，清了缓存以后下一次检查就能拿到新的。
# 注意：update-prices 工作流用 GITHUB_TOKEN 推送的提交不会触发这里，那边自己清缓存。
name: purge-cdn

on:
  push:
    branches: [main]
    paths:
      - 'i18n/zh-CN.json'
      - 'i18n/zh-CN.rules.json'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge jsDelivr cache
        run: |
          for f in i18n/zh-CN.json i18n/zh-CN.rules.json data/prices.json data/meta.json; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || echo 000)
            echo "$f $code"
          done
